version: '3.8'

services:
  backend:
    image: ${DOCKERHUB_USER}/cicd-backend:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - APP_VERSION=${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USER}/cicd-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
